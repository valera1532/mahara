<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080809" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Заказы — MAHARA</title>
  <link rel="icon" href="/assets/icons/favicon.svg?v=20261019-1" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css?v=20261019-1" />
  <link rel="stylesheet" href="/management.css?v=20261015-2" />
  <link rel="stylesheet" href="/orders.css" />
  <script defer src="/orders.js?v=20261015-2"></script>
</head>
<body class="page-orders">
  <a class="skip-link" href="#main-content">Перейти к содержимому</a>
  <header class="management-header">
    <div class="management-header__inner">
      <a class="brand" href="/admin.html" aria-label="MAHARA — управление">
      <img class="brand__logo" src="/assets/icons/mahara-logo-horizontal.svg" alt="MAHARA — Made in Russia" width="190" height="60" />
    </a>
      <span class="management-header__label">Управление</span>
      <nav class="management-nav" aria-label="Разделы управления">
        <a href="/admin.html">Контент и товары</a>
        <a href="/inventory.html">Склад</a>
        <a href="/orders.html" aria-current="page">Заказы</a>
        <a href="/operations.html">Операции</a>
        <a href="/catalog.html">Витрина ↗</a>
      </nav>
      <div class="management-header__actions"><button class="management-logout" type="button" data-logout>Выйти</button></div>
    </div>
  </header>
  <main id="main-content" class="orders-main" tabindex="-1">
    <div class="orders-intro">
      <div><p class="eyebrow">Управление / Заказы</p><h1>Заказы <em>магазина</em></h1></div>
      <button class="orders-button" type="button" data-refresh>Обновить</button>
    </div>
    <noscript><p>Для работы с заказами включите JavaScript.</p></noscript>
    <p class="orders-notice" data-status role="status" aria-live="polite">Загружаем заказы…</p>
    <p class="orders-error" data-error role="alert" hidden></p>
    <div class="orders-filters">
      <label for="orders-search">Номер, покупатель, e-mail или телефон<input id="orders-search" type="search" data-search autocomplete="off" maxlength="200" /></label>
      <label for="orders-filter">Оплата<select id="orders-filter" data-filter><option value="all">Все заказы</option><option value="paid">Оплачены</option><option value="pending">Ожидают оплаты</option><option value="refunded">Возвращены</option><option value="failed">Не оплачены</option></select></label>
    </div>
    <div data-orders class="orders-list"></div>
    <nav class="orders-pagination" aria-label="Страницы заказов">
      <button class="orders-button" type="button" data-page-prev disabled>Назад</button>
      <span data-page-info role="status" aria-live="polite"></span>
      <button class="orders-button" type="button" data-page-next disabled>Далее</button>
    </nav>
  </main>
  <dialog class="orders-dialog" data-refund-dialog aria-labelledby="refund-title">
    <form method="dialog">
      <h2 id="refund-title">Вернуть оплату?</h2>
      <p data-refund-description></p>
      <p>Возврат денег не возвращает вещи на склад. Учитывайте товар после фактического получения.</p>
      <p class="orders-error" data-refund-error role="alert" hidden></p>
      <div class="orders-dialog__actions"><button class="orders-button" value="cancel" data-refund-cancel>Отмена</button><button class="orders-button orders-button--danger" type="button" data-refund-confirm>Вернуть деньги</button></div>
    </form>
  </dialog>
</body>
</html>
