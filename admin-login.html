<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Вход в управление — MAHARA</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css?v=20261011-2" />
  <link rel="stylesheet" href="/admin.css?v=20261011-2" />
  <script defer src="/admin-login.js?v=20261011-2"></script>
</head>
<body class="page-admin page-admin-login">
  <div class="site-noise" aria-hidden="true"></div>
  <main class="cms-login">
    <a class="brand cms-login__brand" href="/" aria-label="MAHARA — на главную">
      <svg class="brand__icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M14 50V32l8-8 5 5V17l5-7 5 7v12l5-5 8 8v18M8 50h48M22 50V35M32 50V21M42 50V35" /></svg>
      <span>MAHARA</span>
    </a>
    <section class="cms-panel cms-login__panel" aria-labelledby="login-title">
      <p class="cms-kicker">Панель управления</p>
      <h1 id="login-title">Вход для<br><em>администратора</em></h1>
      <p class="cms-login__intro">Войдите, чтобы управлять товарами и содержимым сайта.</p>
      <form data-admin-login method="post" action="/api/admin/login">
        <div class="cms-field">
          <label for="admin-username">Логин</label>
          <input id="admin-username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64" />
        </div>
        <div class="cms-field">
          <label for="admin-password">Пароль</label>
          <input id="admin-password" name="password" type="password" autocomplete="current-password" required maxlength="72" />
        </div>
        <p class="cms-global-error" data-login-error role="alert" aria-live="polite"></p>
        <button class="cms-save" type="submit" data-login-submit><span>Войти</span><i aria-hidden="true">↗</i></button>
      </form>
      <noscript><p class="cms-login__intro">Для входа включите JavaScript в настройках браузера.</p></noscript>
    </section>
    <a class="cms-login__back" href="/">← Вернуться на сайт</a>
  </main>
</body>
</html>
